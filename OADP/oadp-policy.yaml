---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: install-oadp-operator
  namespace: openshift-gitops
spec:
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: install-oadp-resources
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: MustHave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-adp

            - complianceType: MustHave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: oadp-operator-group
                  namespace: openshift-adp
                spec:
                  targetNamespaces:
                    - openshift-adp

            - complianceType: MustHave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: oadp-operator
                  namespace: openshift-adp
                spec:
                  channel: stable
                  name: oadp-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic
---
apiVersion: cluster.open-cluster.io/v1beta1
kind: Placement
metadata:
  name: oadp-placement
  namespace: openshift-gitops
spec:
  clusterSets:
    - gitops-configure
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: oadp-placement-binding
  namespace: openshift-gitops
placementRef:
  name: oadp-placement
  kind: Placement
  apiGroup: cluster.open-cluster.io
subjects:
  - name: install-oadp-operator
    kind: Policy
    apiGroup: policy.open-cluster-management.io
